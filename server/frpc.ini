# frpc 配置模板 —— 长空·1951 Kanye 中继
# 用法：
#   1) 在 https://panel.chmlfrp.net 创建一条 UDP 隧道，远程端口例如 24463；
#   2) 把面板给出的 serverAddr / serverPort / token 填到下面；
#   3) 本机先跑 Kanye： Windows  ->  Kanye.exe 24463
#                     Termux/Linux -> ./Kanye 24463
#   4) 再跑 frpc：     Windows  ->  frpc -c frpc.ini
#                     Termux/Linux -> ./frpc -c ./frpc.ini
# 玩家在游戏“联机 → 添加服务器”里填  隧道域名/IP:远程端口  即可跨网联机。

serverAddr = REPLACE_WITH_FRPS_DOMAIN     # 面板“服务器地址/节点域名”
serverPort = 7000                         # 面板给出的 frps 绑定端口
auth.token = REPLACE_WITH_YOUR_TOKEN      # 面板“访问密钥/token”，勿外传

[[proxies]]
name = "kanye1951"
type = "udp"
localIP = "127.0.0.1"
localPort = 24463                         # 必须与 Kanye 启动端口一致
remotePort = 24463                        # 面板分配/你在节点上申请的 UDP 端口
